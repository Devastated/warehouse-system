name: warehouse-system

# Система "Учет складских товаров"
#
#   Браузер (веб-пульт из web/) + curl / Postman
#     |
#     v
#   gateway (API Gateway, YARP + статика) :8080  <-- единственная точка входа
#     |----------------------|------------------------|------------------|
#     v                      v                        v                  v
#   products-service      inventory-service      movements-service   report-service
#   (справочник товаров)  (склады и остатки)     (приход/расход,     (JSON/текст
#        |                     ^   |                история операций)  отчётов)
#        |                     |   | (HTTP)             |                  |
#        v                     |   v                    v                  v
#   PostgreSQL (db) <-----------+   +--------------------+  HTTP-агрегация
#   один сервер БД "app", схемы: products, inventory, movements
#   данные в volume db_data

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: warehouse-gateway
    ports:
      - "8080:8080"
    environment:
      PRODUCTS_URL: http://products:5001/
      INVENTORY_URL: http://inventory:5002/
      MOVEMENTS_URL: http://movements:5003/
      REPORT_URL: http://reports:5004/
    depends_on:
      - products
      - inventory
      - movements
      - reports
    networks:
      - warehouse-net

  products:
    build: ./products-service
    container_name: warehouse-products
    environment:
      DB: "Host=db;Port=5432;Database=app;Username=postgres;Password=1234"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse-net

  inventory:
    build: ./inventory-service
    container_name: warehouse-inventory
    environment:
      DB: "Host=db;Port=5432;Database=app;Username=postgres;Password=1234"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse-net

  movements:
    build: ./movements-service
    container_name: warehouse-movements
    environment:
      DB: "Host=db;Port=5432;Database=app;Username=postgres;Password=1234"
      PRODUCTS_URL: http://products:5001/
      INVENTORY_URL: http://inventory:5002/
    depends_on:
      db:
        condition: service_healthy
      products:
        condition: service_started
      inventory:
        condition: service_started
    networks:
      - warehouse-net

  reports:
    build: ./report-service
    container_name: warehouse-reports
    environment:
      PRODUCTS_URL: http://products:5001/
      INVENTORY_URL: http://inventory:5002/
      MOVEMENTS_URL: http://movements:5003/
      LOW_STOCK: "5"
    depends_on:
      - products
      - inventory
      - movements
    networks:
      - warehouse-net

  db:
    image: postgres:16
    container_name: warehouse-db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warehouse-net

volumes:
  db_data:

networks:
  warehouse-net:
    driver: bridge
